# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: save_serialization
    status: active
    api: "JSON stringify/parse with every integer carried as a decimal string"
    not: "JSON numbers, FileAccess.store_var, custom binary"
    adr: docs/architecture/adr-0002-persistence-format.md
    reason: "Godot 4 JSON parsing returns every number as float, so int64 beyond 2^53 cannot round-trip; GDD rule 24 also requires integers in decimal"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - purpose: single_writer_file_lock
    status: active
    api: "atomically created lock directory (DirAccess.make_dir) + heartbeat timestamp"
    not: "OS.is_process_running, named mutex, port lock"
    adr: docs/architecture/adr-0002-persistence-format.md
    reason: "OS.is_process_running only sees child processes in Godot 4.7, so it reports every independently launched instance as dead"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - purpose: atomic_file_replace
    status: active
    api: "temp file -> rename primary to backup -> rename temp to primary"
    not: "writing directly to the primary path"
    adr: docs/architecture/adr-0002-persistence-format.md
    reason: "A crash in any window leaves either the primary, the backup or both recoverable"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - purpose: screen_mount
    status: active
    api: "PackedScene.instantiate() + add_child() / remove_child() + queue_free(), one PackedScene per screen"
    not: "SceneTree.change_scene_to_file() / one mega-scene with visibility toggles"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "change_scene_* unloads the whole tree (kills HUD and SceneFlow) and defers a frame"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: focus_neighbours
    status: active
    api: "explicit Control.focus_neighbor_* resolved to the next eligible control, applied after present()"
    not: "geometric auto-resolution via find_next_valid_focus()"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "declared screen-position order survives 150% text reflow and is headlessly assertable"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: focus_query
    status: active
    api: "Viewport.gui_get_focus_owner() projected by InputRouter"
    not: "per-screen focus bookkeeping"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "single authority; Godot 4.6 separates hover from keyboard focus"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: top_level_transition_visual
    status: active
    api: "FadeLayer ColorRect + Tween, cover-and-reveal, total <= 0.2 s, never awaited"
    not: "holding the outgoing screen an extra frame; tween_await() in the state path"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "scene-flow AC 31 forbids a frame where state changed but the old picture still shows"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: content_record_format
    status: active
    api: "Typed Resource subclasses (.tres) plus explicit catalog manifest resources"
    not: "Runtime JSON/CSV parsing"
    adr: docs/architecture/adr-0001-content-data-format.md
    reason: "Type safety, inspector authoring and native resource references for under 100 records; no parser to maintain."
    referenced_by:
      - docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04
    revised: ""

  - purpose: no_autoloads
    status: active
    api: "AppRoot (root of main.tscn) constructs every service and injects it by constructor"
    not: "Godot autoload singletons, service locators, lookup by node name"
    adr: docs/architecture/adr-0004-service-composition-signals.md
    reason: "Zero autoloads makes construction order explicit and assertable; services stay independently testable"
    referenced_by:
      - docs/architecture/adr-0004-service-composition-signals.md
    added: 2026-11-04
    revised: ""

  - purpose: pause_mechanism
    status: active
    api: "SceneTree.paused = true plus an explicit PROCESS_MODE_ALWAYS allow-list (SceneFlow, UIRoot, AudioDirector, FadeLayer)"
    not: "per-node pause flags, manual _process guards, or pausing by disabling input"
    adr: docs/architecture/adr-0004-service-composition-signals.md
    reason: "One authoritative pause switch; audio and UI keep running while gameplay freezes"
    referenced_by:
      - docs/architecture/adr-0004-service-composition-signals.md
    added: 2026-11-04
    revised: ""

  - purpose: state_signal_fanout
    status: active
    api: "state_changed has exactly one subscriber (AppRoot), which fans out synchronously in a fixed order"
    not: "multiple systems connecting directly to state_changed and relying on connect() order"
    adr: docs/architecture/adr-0004-service-composition-signals.md
    reason: "Godot's connect() order is not a contract; a single subscriber makes ordering and reentrancy enumerable"
    referenced_by:
      - docs/architecture/adr-0004-service-composition-signals.md
    added: 2026-11-04
    revised: ""

  - purpose: nav_repeat
    status: active
    api: "Input-layer NavRepeater computes nav_steps as a pure function and pushes synthetic InputEventAction once per step"
    not: "reading InputEvent.echo or letting the engine's GUI repeat generate navigation"
    adr: docs/architecture/adr-0005-input-context-stack.md
    reason: "Repeat rate must be identical across keyboard, gamepad and synthetic events and assertable headlessly"
    referenced_by:
      - docs/architecture/adr-0005-input-context-stack.md
    added: 2026-11-04
    revised: ""

  - purpose: rng_seed_derivation
    status: active
    api: "32-bit lane-separated FNV-1a over (station_id, seed, attempt), producing an int64 seed"
    not: "String.hash(), global randi(), or seed+1 reroll increments"
    adr: docs/architecture/adr-0006-deterministic-rng.md
    reason: "String.hash() is not stable across engine versions; lane separation makes every candidate reproducible"
    referenced_by:
      - docs/architecture/adr-0006-deterministic-rng.md
    added: 2026-11-04
    revised: ""

  - purpose: shuffle_algorithm
    status: active
    api: "canonical id-sorted order + reverse Fisher-Yates + rejection sampling, all integer-only"
    not: "Array.shuffle(), randi_range(), or float-weighted sampling"
    adr: docs/architecture/adr-0006-deterministic-rng.md
    reason: "Only an explicit algorithm yields the same menu on every platform and frame order"
    referenced_by:
      - docs/architecture/adr-0006-deterministic-rng.md
    added: 2026-11-04
    revised: ""

  - purpose: health_threshold_comparison
    status: active
    api: "integer cross-multiplication (reachable * DEN vs baseline * NUM) for the 0.9 lower bound"
    not: "floating-point comparison against 0.9 * opt_value"
    adr: docs/architecture/adr-0006-deterministic-rng.md
    reason: "0.9 * 104 is not exactly representable in float; integer comparison removes a platform-dependent boundary"
    referenced_by:
      - docs/architecture/adr-0006-deterministic-rng.md
    added: 2026-11-04
    revised: ""

  - purpose: settings_document
    status: active
    api: "user://config/settings.json, canonical JSON with integers as decimal strings, temp->backup->primary replace"
    not: "ConfigFile / user://settings.cfg, write-on-every-change, or storing settings in the career save"
    adr: docs/architecture/adr-0008-settings-localization.md
    reason: "Settings are machine-level, must be readable before the first frame, and must survive career deletion"
    referenced_by:
      - docs/architecture/adr-0008-settings-localization.md
    added: 2026-11-04
    revised: ""

  - purpose: ui_string_localization
    status: active
    api: "every player-visible string is a tr() key; content display_name/description use content.<type>.<id>.<field>"
    not: "hardcoded Chinese text in scenes, resources or GDScript"
    adr: docs/architecture/adr-0008-settings-localization.md
    reason: "Key coverage is assertable in CI; adding a language must not rewrite content records"
    referenced_by:
      - docs/architecture/adr-0008-settings-localization.md
    added: 2026-11-04
    revised: ""

  - purpose: cjk_font_fallback
    status: active
    api: "built-in Noto Sans SC -> SystemFont list -> ThemeDB.fallback_font, with .import parameters pinned"
    not: "relying on 4.7 default import settings or MSDF for CJK body text"
    adr: docs/architecture/adr-0008-settings-localization.md
    reason: "Missing glyphs degrade to a different-looking glyph instead of tofu; pinned hinting keeps 20 px strokes legible"
    referenced_by:
      - docs/architecture/adr-0008-settings-localization.md
    added: 2026-11-04
    revised: ""

