  - purpose: settlement_transaction_boundary
    status: active
    api: "single pure RefCounted SettlementTransaction built by AppRoot, called only by UIRoot; one SaveSystem.commit per run inside reset_for_state(Menu, result) before the receipt mounts"
    not: "commit in a run_settled listener, separate wallet and records commits, a second settlement pass"
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    reason: "Handoff abandonment must not write; two writers would break the single-writer transaction"
    referenced_by:
      - docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04
    revised: ""

  - purpose: receipt_data_source
    status: active
    api: "immutable ReceiptSnapshot built by SettlementTransaction, carrying save_state and abort_code"
    not: "re-running Settlement.settle or reading live Records / MetaUpgrades from ReceiptScreen"
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    reason: "The receipt must show exactly the transaction outcome, including aborted and unsaved states"
    referenced_by:
      - docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04
    revised: ""

  - purpose: run_fault_phase
    status: active
    api: "fault.phase = INIT when run_started was never emitted, RUN afterwards; init_failed only means the payload has no RunResult"
    not: "Faulted implies RUN; inferring the phase from the scene, from init_failed, or from an error-code string"
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    reason: "run_id allocation overflow is Faulted before any run exists and must get INIT copy"
    referenced_by:
      - docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04
    revised: ""

  - purpose: audio_cue_dispatch
    status: active
    api: "AudioDirector.request(event, payload) / play(cue_id, context) -> CueDecision; decisions live in the pure AudioPolicy RefCounted"
    not: "direct AudioStreamPlayer.play() from UI or HUD, AudioServer bus-volume mixing, per-cue stream loading at runtime"
    adr: docs/architecture/adr-0009-audio-playback-pause.md
    reason: "One admission path is the only way MAX_VOICES, per-priority caps, steals, cooldowns and the cue log stay assertable"
    referenced_by:
      - docs/architecture/adr-0009-audio-playback-pause.md
    added: 2026-11-04
    revised: ""

  - purpose: audio_pause_semantics
    status: active
    api: "SceneTree.paused plus PROCESS_MODE_ALWAYS on AudioDirector / VoicePoolHost / UiTransitionPlayer; same-frame stop() of every pool voice"
    not: "PROCESS_MODE_WHEN_PAUSED, engine auto-pause, deferred stop, replay after resume"
    adr: docs/architecture/adr-0009-audio-playback-pause.md
    reason: "Audio must observe Paused -> Run while paused; WHEN_PAUSED would miss the resume cue"
    referenced_by:
      - docs/architecture/adr-0009-audio-playback-pause.md
    added: 2026-11-04
    revised: ""

# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: direct_save_file_write
    status: active
    description: "A caller module must never open, write, rename or delete any file under user://save/. Mutation goes through SaveSystem.commit only."
    why: "Save owns atomicity, backup rotation and the single-writer lock; a second writer bypasses all three."
    adr: docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04

  - pattern: json_number_in_save_document
    status: active
    description: "Never write an integer as a JSON number in the save document. Every integer is a decimal string."
    why: "JSON.parse_string returns all numbers as float, corrupting any value beyond 2^53 and breaking the byte-identical round-trip."
    adr: docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04

  - pattern: change_scene_to_file_for_ui
    status: active
    description: "UI screens must never be swapped with SceneTree.change_scene_to_file()."
    why: "Unloads the whole tree, destroying HUD and SceneFlow; cannot express the screen stack or same-frame rules."
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04

  - pattern: screen_direct_input_event_handling
    status: active
    description: "Screens must not listen to InputEvent or rely on BaseButton's automatic ui_accept activation."
    why: "Activation must pass one entry point so ui_button_activated fires exactly once."
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04

  - pattern: deferred_screen_removal
    status: active
    description: "Never queue_free() a screen still in the tree; remove_child() first."
    why: "queue_free() frees at frame end, so the outgoing screen keeps drawing for the rest of the frame."
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04

  - pattern: modal_scrim_only
    status: active
    description: "A modal must not rely on a MOUSE_FILTER_STOP scrim alone to block the screen beneath."
    why: "The scrim stops the mouse only; Tab and ui_focus_next still reach the controls behind it."
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04

  - pattern: balance_literal_in_gdscript
    status: active
    description: "Gameplay values must come from content records; GDScript may hold only structural constants (0, 1, empty)."
    why: "One owner per number; changing balance must not require a code edit."
    adr: docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04

  - pattern: runtime_catalog_directory_scan
    status: active
    description: "Do not enumerate res://data with DirAccess at runtime; load the explicit catalog manifests."
    why: "Exported PCKs convert text resources to binary and add .uid sidecars; scans miss or double-count records."
    adr: docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04

  - pattern: partial_catalog_publish
    status: active
    description: "Never expose a subset of validated records; a single ERROR keeps the whole catalog unpublished."
    why: "Downstream systems assume every id resolves; a partial catalog turns a data error into a runtime crash."
    adr: docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04

  - pattern: autoload_singleton_coupling
    status: active
    description: "No autoload singletons and no service locator / lookup-by-name; every service is constructor-injected by AppRoot."
    why: "Hidden global lookup makes construction order implicit and prevents isolated tests (ADR-0004 D1-D3)."
    adr: docs/architecture/adr-0004-service-composition-signals.md
    added: 2026-11-04

  - pattern: multi_subscriber_state_changed
    status: active
    description: "Only AppRoot may connect to state_changed; other systems consume the fixed-order fan-out, never connect directly."
    why: "connect() order is not a contract; multiple subscribers make same-frame ordering and reentrancy unassertable."
    adr: docs/architecture/adr-0004-service-composition-signals.md
    added: 2026-11-04

  - pattern: screen_polls_input_state
    status: active
    description: "Screens must not poll Input.is_action_just_pressed() or handle raw input events; they receive actions through ActionSink."
    why: "Two delivery paths break first-consumer-wins and make the consumed bit inconsistent (ADR-0005 D4)."
    adr: docs/architecture/adr-0005-input-context-stack.md
    added: 2026-11-04

  - pattern: global_rng_in_menu_generation
    status: active
    description: "Menu generation must not use Array.shuffle(), global randi(), or any unseeded engine RNG."
    why: "Unseeded/global RNG breaks cross-platform reproducibility of the same (station_id, seed) menu (ADR-0006)."
    adr: docs/architecture/adr-0006-deterministic-rng.md
    added: 2026-11-04

  - pattern: float_health_threshold
    status: active
    description: "The menu health gate must not compare a float against 0.9 * opt_value; use integer cross-multiplication."
    why: "Float representation makes the boundary platform-dependent and turns a golden fixture into a permanent red light."
    adr: docs/architecture/adr-0006-deterministic-rng.md
    added: 2026-11-04

  - pattern: hardcoded_player_visible_string
    status: active
    description: "Player-visible text must go through tr(); content records store translation keys, not Chinese text."
    why: "Hardcoded text makes translation coverage unassertable and forces a content rewrite when a language is added (ADR-0008)."
    adr: docs/architecture/adr-0008-settings-localization.md
    added: 2026-11-04

  - pattern: settings_inside_career_save
    status: active
    description: "Never store machine-level settings in the career save or reset them when the career is deleted."
    why: "Settings must be readable before the first frame and survive career deletion (ADR-0008; save-system rule 20)."
    adr: docs/architecture/adr-0008-settings-localization.md
    added: 2026-11-04

  - pattern: second_settlement_writer
    status: active
    description: "No system except SettlementTransaction may build or commit the end-of-run payload."
    why: "Two writers reintroduce the split wallet/records commit ADR-0007 forbids."
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04

  - pattern: commit_at_run_settled
    status: active
    description: "Do not call prepare_* or SaveSystem.commit from a run_settled listener."
    why: "run_settled precedes Handoff, where quitting must discard the result without writing."
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04

  - pattern: receipt_recomputes_settlement
    status: active
    description: "ReceiptScreen must never call Settlement, read RunLog, or recompute totals."
    why: "A second arithmetic path drifts from the committed transaction and hides failure states."
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04

  - pattern: settlement_wallet_write_outside_meta
    status: active
    description: "Settlement must not write the wallet; only MetaUpgrades computes progression."
    why: "Settlement is pure and has no I/O; wallet ownership is singular."
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04

  - pattern: fault_phase_collapse
    status: active
    description: "Do not infer INIT/RUN from the scene, from init_failed, or from Faulted alone."
    why: "Only run_started emission distinguishes an entry failure from a post-start fault."
    adr: docs/architecture/adr-0007-run-state-settlement-transaction.md
    added: 2026-11-04

  - pattern: audio_player_alloc_on_play
    status: active
    description: "Never instantiate or free an AudioStreamPlayer on the playback path; the 10-voice pool and the transition player are built once at boot."
    why: "Pause must stop a fixed voice set in one frame, and MAX_VOICES becomes unenforceable if nodes are created per request."
    adr: docs/architecture/adr-0009-audio-playback-pause.md
    added: 2026-11-04

  - pattern: audio_gain_on_bus
    status: active
    description: "Master / SFX / UI bus volume stays 0 dB; cue_volume_db is computed once per voice and only Music is written by ducking."
    why: "The GDD volume formula already includes bus_offset, master and sfx gain; writing buses too double-attenuates and hides the formula from headless tests."
    adr: docs/architecture/adr-0009-audio-playback-pause.md
    added: 2026-11-04

  - pattern: audio_rng_draw
    status: active
    description: "src/audio must not call randf/randi/randi_range/Array.shuffle, construct a RandomNumberGenerator, or consume SessionRng."
    why: "Consuming SessionRng would make run seeds depend on audio event counts, breaking ADR-0006 reproducibility."
    adr: docs/architecture/adr-0009-audio-playback-pause.md
    added: 2026-11-04

