# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: save
    status: active
    budget_ms: 50
    adr: docs/architecture/adr-0002-persistence-format.md
    notes: "Career write p95 <= 50 ms and load p95 <= 100 ms at the Full Vision 8.5 KiB fixture; main-thread only, no background save thread"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

