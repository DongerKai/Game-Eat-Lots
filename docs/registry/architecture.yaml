# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - system: save
    status: active
    budget_ms: 50
    adr: docs/architecture/adr-0002-persistence-format.md
    notes: "Career write p95 <= 50 ms and load p95 <= 100 ms at the Full Vision 8.5 KiB fixture; main-thread only, no background save thread"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - system: menu-waves
    status: active
    budget_ms: 4
    adr: docs/architecture/adr-0006-deterministic-rng.md
    notes: "initialize() p95 <= 4 ms including the worst 21 candidates; < 0.3 ms/candidate typical; NODE_BUDGET 10^4, STATE_CELL_BUDGET 262144, BASELINE_CELL_BUDGET 65536; over-budget returns DEGRADED and never blocks the run"
    referenced_by:
      - docs/architecture/adr-0006-deterministic-rng.md
    added: 2026-11-04
    revised: ""

  - system: settings
    status: active
    budget_ms: 2
    adr: docs/architecture/adr-0008-settings-localization.md
    notes: "Settings document < 1 KiB; encode+write < 2 ms and decode+validate < 1 ms, each once per session/modal close; three Theme variants built once at boot; per-frame path performs no I/O"
    referenced_by:
      - docs/architecture/adr-0008-settings-localization.md
    added: 2026-11-04
    revised: ""

