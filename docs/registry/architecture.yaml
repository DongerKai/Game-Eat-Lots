# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: save_commit
    status: active
    pattern: direct_call
    producer: save-system
    consumers:
      - meta-upgrades
      - unlocks-and-stations
      - records-and-milestones
      - ui-flow
    adr: docs/architecture/adr-0002-persistence-format.md
    signal_signature: "commit(tx: Dictionary) -> CommitResult"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - contract: ui_screen_mount
    status: active
    pattern: direct_call
    producer: scene-flow
    consumers:
      - ui-flow
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    signal_signature: "state_changed(from: SceneState, to: SceneState, payload: Variant)"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - contract: ui_modal_context
    status: active
    pattern: direct_call
    producer: ui-flow
    consumers:
      - input
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    signal_signature: "push_context(&\"Modal\") / pop_context() — paired; no pop after a top-level transition"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - contract: ui_activation
    status: active
    pattern: direct_call
    producer: input
    consumers:
      - ui-flow
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    signal_signature: "handle_action(action: StringName) -> bool — exactly once per press"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - contract: content_boot_gate
    status: active
    pattern: signal
    producer: data-config
    consumers:
      - scene-flow
      - save
      - records
      - run-flow
    adr: docs/architecture/adr-0001-content-data-format.md
    signal_signature: "ready(); failed(error: DataError)"
    referenced_by:
      - docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04
    revised: ""

  - contract: content_query
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - dish-values
      - cloying-and-taste
      - menu-waves
      - meta-upgrades
      - run-flow
      - settlement
      - unlocks-and-stations
      - ui-flow
      - records
    adr: docs/architecture/adr-0001-content-data-format.md
    signal_signature: "get_dish(id) / get_upgrade(id) / get_station(id) / get_dish_icon(id) -> DataResult; get_balance() -> BalanceData (READY only)"
    referenced_by:
      - docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04
    revised: ""

