# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: save_serialization
    status: active
    api: "JSON stringify/parse with every integer carried as a decimal string"
    not: "JSON numbers, FileAccess.store_var, custom binary"
    adr: docs/architecture/adr-0002-persistence-format.md
    reason: "Godot 4 JSON parsing returns every number as float, so int64 beyond 2^53 cannot round-trip; GDD rule 24 also requires integers in decimal"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - purpose: single_writer_file_lock
    status: active
    api: "atomically created lock directory (DirAccess.make_dir) + heartbeat timestamp"
    not: "OS.is_process_running, named mutex, port lock"
    adr: docs/architecture/adr-0002-persistence-format.md
    reason: "OS.is_process_running only sees child processes in Godot 4.7, so it reports every independently launched instance as dead"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - purpose: atomic_file_replace
    status: active
    api: "temp file -> rename primary to backup -> rename temp to primary"
    not: "writing directly to the primary path"
    adr: docs/architecture/adr-0002-persistence-format.md
    reason: "A crash in any window leaves either the primary, the backup or both recoverable"
    referenced_by:
      - docs/architecture/adr-0002-persistence-format.md
    added: 2026-11-04
    revised: ""

  - purpose: screen_mount
    status: active
    api: "PackedScene.instantiate() + add_child() / remove_child() + queue_free(), one PackedScene per screen"
    not: "SceneTree.change_scene_to_file() / one mega-scene with visibility toggles"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "change_scene_* unloads the whole tree (kills HUD and SceneFlow) and defers a frame"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: focus_neighbours
    status: active
    api: "explicit Control.focus_neighbor_* resolved to the next eligible control, applied after present()"
    not: "geometric auto-resolution via find_next_valid_focus()"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "declared screen-position order survives 150% text reflow and is headlessly assertable"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: focus_query
    status: active
    api: "Viewport.gui_get_focus_owner() projected by InputRouter"
    not: "per-screen focus bookkeeping"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "single authority; Godot 4.6 separates hover from keyboard focus"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: top_level_transition_visual
    status: active
    api: "FadeLayer ColorRect + Tween, cover-and-reveal, total <= 0.2 s, never awaited"
    not: "holding the outgoing screen an extra frame; tween_await() in the state path"
    adr: docs/architecture/adr-0003-scene-screen-architecture.md
    reason: "scene-flow AC 31 forbids a frame where state changed but the old picture still shows"
    referenced_by:
      - docs/architecture/adr-0003-scene-screen-architecture.md
    added: 2026-11-04
    revised: ""

  - purpose: content_record_format
    status: active
    api: "Typed Resource subclasses (.tres) plus explicit catalog manifest resources"
    not: "Runtime JSON/CSV parsing"
    adr: docs/architecture/adr-0001-content-data-format.md
    reason: "Type safety, inspector authoring and native resource references for under 100 records; no parser to maintain."
    referenced_by:
      - docs/architecture/adr-0001-content-data-format.md
    added: 2026-11-04
    revised: ""

