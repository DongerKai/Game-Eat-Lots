# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: valid_record_set
    status: active
    source: design/gdd/data-config.md
    referenced_by:
      - design/gdd/data-config.md
    variables:
      - D_dish
      - D_upg
      - D_sta
      - D_bal
      - TAGSET
    output_range: [0, 1]
    expression: "uniqueIds(D_dish) and uniqueIds(D_upg) and uniqueIds(D_sta) and all R_dish and all R_upg and all R_sta and all R_bal"
    notes: "Boolean validity predicate over the four record sets. 1 = valid (game starts); 0 = blocked. Per-record predicates R_dish / R_upg / R_sta / R_bal are defined in the source GDD; R_bal validates the singleton BalanceData.base_capacity."
    added: "2026-11-03"
    revised: ""

  - name: nav_steps
    status: active
    source: design/gdd/input.md
    referenced_by:
      - design/gdd/input.md
    variables:
      - T
      - D
      - I
    output_range: [1, 999]
    expression: "1 + max(0, floor((T - D) / I) + 1)"
    notes: "Navigation steps produced by a directional hold of T seconds. D = repeat_delay (0.35 s start), I = repeat_interval (0.12 s start). Unbounded in formula; the 999 ceiling is the practical clamp for a hold of ~2 minutes."
    added: "2026-11-03"
    revised: ""

  - name: stick_engaged
    status: active
    source: design/gdd/input.md
    referenced_by:
      - design/gdd/input.md
    variables:
      - m
      - E
      - R
      - stick_engaged_prev
    output_range: [0, 1]
    expression: "(m >= E) or (stick_engaged_prev and m >= R)"
    notes: "Boolean hysteresis for analog-stick navigation. E = 0.60 engage, R = 0.40 release; constraint R <= E - 0.10. 1 = counts as navigation input, 0 = does not."
    added: "2026-11-03"
    revised: ""

  - name: unit_value
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
      - design/gdd/cloying-and-taste.md
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - price
      - satiety
    output_range: [0, 9999]
    expression: "float64(price) / float64(satiety)"
    notes: "元/格. The only cross-dish comparison scale. Displayed at two decimals at settlement only; never shown in-run and never used for gameplay comparison."
    added: "2026-11-03"
    revised: ""

  - name: uv_cmp
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
      - design/gdd/cloying-and-taste.md
    variables:
      - price_a
      - satiety_a
      - price_b
      - satiety_b
    output_range: [-1, 1]
    expression: "sign(price_a * satiety_b - price_b * satiety_a)"
    notes: "Exact integer comparison; -1/0/+1. 0 means exact equality, never a rounding artefact. int64 product is safe for INT32_MAX inputs."
    added: "2026-11-03"
    revised: ""

  - name: uv_span
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
    variables:
      - M
    output_range: [0, 9999]
    expression: "uv_max(M) - uv_min(M)"
    notes: "Spread of unit value inside a menu. Max/min chosen by uv_cmp; healthy threshold 1.5 with 1e-9 tolerance."
    added: "2026-11-03"
    revised: ""

  - name: menu_healthy
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
    variables:
      - M
    output_range: [0, 1]
    expression: "(uv_span(M) >= 1.5 - 1e-9) and (same_group_dominated_pairs(M) = 0) and tier_coverage(M)"
    notes: "1 = the station dish_pool may ship; not applied to single wave menus. tier_coverage requires satiety 1, 2-4 and >=5 all present. Balance audit only; never blocks startup."
    added: "2026-11-03"
    revised: ""

  - name: dominates
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
    variables:
      - price_a
      - satiety_a
      - cloying_group_a
      - price_b
      - satiety_b
      - cloying_group_b
    output_range: [0, 1]
    expression: "same_group(A,B) and price(B) >= price(A) and satiety(B) <= satiety(A) and (price(B) > price(A) or satiety(B) < satiety(A))"
    notes: "Strict dominance within one cloying_group; two empty groups count as the same group. Any same-group dominated pair is a design error."
    added: "2026-11-03"
    revised: ""

  - name: opt_value
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
      - design/gdd/cloying-and-taste.md
      - design/gdd/menu-waves.md
      - design/gdd/meta-upgrades.md
      - design/gdd/unlocks-and-stations.md
    variables:
      - M
      - C
      - T
    output_range: [0, 99999]
    expression: "max sum(price(d) for d in S) subject to S subset M, |S| <= T, sum(satiety(d)) <= C"
    notes: "0/1 knapsack. Design-time and CI only; never runs in-game. 12 dishes, C=20, T=10 gives 104."
    added: "2026-11-03"
    revised: ""

  - name: calibration_ratio
    status: active
    source: design/gdd/dish-values.md
    referenced_by:
      - design/gdd/dish-values.md
      - design/gdd/cloying-and-taste.md
      - design/gdd/settlement-and-entry-fee.md
      - design/gdd/meta-upgrades.md
    variables:
      - opt_value
      - entry_fee
    output_range: [0, 999]
    expression: "opt_value(M, C0, T) / entry_fee"
    notes: "Target band [1.15, 1.35] constrains the unupgraded ceiling. opt_value ignores cloying penalties, but the 12-dish pool has a zero-penalty witness order (红烧肉 -> 拍黄瓜 -> 糖醋里脊 -> rest), so 104 and 85 remain valid: 1.224. Max capacity 25 gives 120/85 = 1.412, which must fall in the full-level band [1.35, 1.45]. Recompute after any capacity or cloying-resistance upgrade."
    added: "2026-11-03"
    revised: "2026-11-03"

  - name: extra_satiety
    status: active
    source: design/gdd/cloying-and-taste.md
    referenced_by:
      - design/gdd/cloying-and-taste.md
      - design/gdd/settlement-and-entry-fee.md
      - design/gdd/meta-upgrades.md
    variables:
      - group_cloy
      - cloy_cap
      - cloying_resistance
    output_range: [0, 3]
    expression: "max(0, min(group_cloy(group(d)), cloy_cap) - floor(cloying_resistance))"
    notes: "Extra capacity charged for a repeated cloying group, using the count BEFORE this dish. cloying_resistance comes from the run snapshot; it is floored once and subtracted at read time. cloy_cap = 3 is a safety bound; the MVP pool's largest group is 2, so the cap never binds."
    added: "2026-11-03"
    revised: ""

  - name: effective_satiety
    status: active
    source: design/gdd/cloying-and-taste.md
    referenced_by:
      - design/gdd/cloying-and-taste.md
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - satiety
      - extra_satiety
    output_range: [1, 9]
    expression: "satiety(d) + extra_satiety(d)"
    notes: "The only capacity gate in-run. Settlement must sum effective_satiety, not raw satiety. unit_value stays price/raw satiety."
    added: "2026-11-03"
    revised: ""

  - name: cleanse_target
    status: active
    source: design/gdd/cloying-and-taste.md
    referenced_by:
      - design/gdd/cloying-and-taste.md
    variables:
      - group_cloy
      - group
    output_range: [0, 9]
    expression: "argmax over g != group(d) with group_cloy(g) >= 1 of group_cloy(g), tie-break by canonical group order"
    notes: "Canonical order: 主食, 蔬菜, 饮料, 甜, 蛋, 辣, 油, 鲜, 肉. No target when none qualifies. A dish can never cleanse its own group."
    added: "2026-11-03"
    revised: ""

  - name: menu_cloy_pressure
    status: active
    source: design/gdd/cloying-and-taste.md
    referenced_by:
      - design/gdd/cloying-and-taste.md
    variables:
      - M
    output_range: [0, 12]
    expression: "sum over groups g in M of (count of d in M with group(d)=g) - 1"
    notes: "How many dishes in a menu can ever trigger a repeat surcharge. 0 means the cloying layer is inert on that menu. Current 12-dish pool = 3."
    added: "2026-11-03"
    revised: ""

  - name: wave_partition
    status: active
    source: design/gdd/menu-waves.md
    referenced_by:
      - design/gdd/menu-waves.md
    variables:
      - M
      - seed
      - wave_size
    output_range: [1, 12]
    expression: "wave_count = ceil(|M|/wave_size); W_i = shuffled(M, seed)[i*wave_size:(i+1)*wave_size]"
    notes: "Deterministic ordered partition of the station pool; every dish appears in exactly one wave. MVP: 12 dishes, wave_size 4 -> 3 waves."
    added: "2026-11-03"
    revised: ""

  - name: preview_dishes
    status: active
    source: design/gdd/menu-waves.md
    referenced_by:
      - design/gdd/menu-waves.md
    variables:
      - menu_vision
      - wave_size
    output_range: [0, 7]
    expression: "min(menu_vision, wave_size - 1, |W_next|)"
    notes: "Dishes of the next wave revealed by MENU_VISION. Never a whole wave: with 12 unique dishes, seeing two full waves lets the player deduce the third."
    added: "2026-11-03"
    revised: ""

  - name: wave_reachable_opt
    status: active
    source: design/gdd/menu-waves.md
    referenced_by:
      - design/gdd/menu-waves.md
    variables:
      - M
      - seed
      - C0
      - T
    output_range: "[0, opt_value(pool, C0, T)]"
    expression: "max sum(price(d)) over legal wave play sequences (subset S_i per wave; each eaten dish costs 1 turn; a non-final wave with S_i != W_i costs 1 more turn to skip the rest; sum(satiety) <= C0; eats + skips <= T; free end when turns are exhausted mid-run)"
    notes: "Generation-time only. The health check ignores cloying and uses static satiety, so this is an upper bound on the true reachable value, used only to reject obviously bad partitions. Wave-reset DP carrying (waves processed, capacity used, turns used): (wave_count + 1) x 21 x 11 = 924 carry states for MVP (4 x 21 x 11), one knapsack per wave merged at wave boundaries, <= 1e4 nodes. 104 with no skips, 100 with one, 95 with two."
    added: "2026-11-03"
    revised: "2026-11-04"

  - name: wave_healthy
    status: active
    source: design/gdd/menu-waves.md
    referenced_by:
      - design/gdd/menu-waves.md
    variables:
      - M
      - seed
      - pool
      - C0
      - T
    output_range: "HEALTHY | DEGRADED | UNHEALTHY"
    expression: "UNHEALTHY if any wave empty or waves do not partition M or (reachable check ran and wave_reachable_opt < 0.9 * opt_value(pool, C0, T)); DEGRADED if non-empty/partition pass but the reachable check was skipped over the node budget; HEALTHY otherwise"
    notes: "Three-state gate (HEALTHY / DEGRADED / UNHEALTHY) for a generated partition. DEGRADED means the reachable check was skipped over the node budget. MVP lower bound 94 (0.9 x 104); the upper bound is not enforced here. Reroll up to 20 seeds; accept the best with a warning rather than blocking the run."
  - name: total_value
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - R
      - price
    output_range: [0, 999999]
    expression: "sum of price(d_i) for i in 1..n"
    notes: "Run total eaten value in int64. Rows follow eaten order. Checked addition; overflow returns OVERFLOW, never wraps. Empty run = 0."
    added: "2026-11-03"
    revised: ""

  - name: net_profit
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
      - design/gdd/meta-upgrades.md
      - design/gdd/unlocks-and-stations.md
    variables:
      - total_value
      - entry_fee
    output_range: [-99999, 999999]
    expression: "total_value(R) - entry_fee"
    notes: "Signed int64. Never clamped. entry_fee is RunLog.entry_fee (frozen at run start from RunConfig.entry_fee_override or StationData.entry_fee); settlement never re-reads the station. Wallet application (including whether loss is charged) is owned by 局外升级, not by settlement."
    added: "2026-11-03"
    revised: ""

  - name: broke_even
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - net_profit
    output_range: [0, 1]
    expression: "net_profit(R) >= 0"
    notes: "Derived predicate, never a stored field. Exactly 0 counts as break-even. Downstream must read the predicate, not re-derive it from displayed text."
    added: "2026-11-03"
    revised: ""

  - name: return_ratio
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - total_value
      - entry_fee
    output_range: [0, 999]
    expression: "total_value(R) / entry_fee; undefined when entry_fee = 0"
    notes: "entry_fee is RunLog.entry_fee (frozen at run start). Actual run value over fee, not the design-time calibration upper bound. Display via return_percent_x10 = floor(1000 * total / fee), one decimal percent. Fee 0 renders 免单."
    added: "2026-11-03"
    revised: ""

  - name: effective_unit_value
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - price
      - effective_satiety
    output_range: [0, 9999]
    expression: "price(d) / effective_satiety(d)"
    notes: "Receipt-only counterpart of unit_value. unit_value keeps price/raw satiety and stays the cross-dish scale; this one shows what a repeated dish actually cost per cell. Never used for sorting or gate decisions."
    added: "2026-11-03"
    revised: ""

  - name: running_net
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - price
      - entry_fee
      - k
    output_range: [-99999, 999999]
    expression: "sum(price(d_i) for i in 1..k) - entry_fee"
    notes: "Live HUD net profit. Must start at -entry_fee before the first dish. HUD must call this instead of summing prices itself, or the in-run and settlement numbers drift."
    added: "2026-11-03"
    revised: ""

  - name: shortfall
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - entry_fee
      - price
      - k
    output_range: [0, 99999]
    expression: "max(0, entry_fee - sum(price(d_i) for i in 1..k))"
    notes: "How much is still needed to break even; monotonically non-increasing, 0 after break-even. Paired with running_net on the HUD."
    added: "2026-11-03"
    revised: ""

  - name: capacity_used
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
      - design/gdd/stomach-capacity.md
    variables:
      - effective_satiety
    output_range: [0, 999]
    expression: "sum(effective_satiety(d_i) for i in 1..n)"
    notes: "Must equal RunLog.capacity_used; mismatch returns CAPACITY_MISMATCH. Exceeding capacity_total returns CAPACITY_OVERFLOW and is never clamped."
    added: "2026-11-03"
    revised: ""

  - name: wasted_capacity
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - capacity_total
      - capacity_used
    output_range: [0, 999]
    expression: "capacity_total(R) - capacity_used(R)"
    notes: "Unused capacity. Paired with cloy_extra_total so the receipt separates avoidable repetition cost from turns running out."
    added: "2026-11-03"
    revised: ""

  - name: cloy_extra_total
    status: active
    source: design/gdd/settlement-and-entry-fee.md
    referenced_by:
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - extra_satiety
    output_range: [0, 99]
    expression: "sum(extra_satiety(d_i) for i in 1..n)"
    notes: "Total capacity paid to the cloying system this run. Uses the per-row snapshot recorded at eat time; settlement never replays the cloying sequence."
    added: "2026-11-03"
    revised: ""

