    variables:
      - U
      - S
      - D
    output_range: "stations/stations_total + dishes/dishes_total"
    expression: "S_eff = {s in S : s.unlock_cost = 0 or s.id in U.stations}; stations=|S_eff|, stations_total=|S|, dishes=sum(|s.dish_pool| for s in S_eff), dishes_total=|D|"
    notes: "Display counters. An empty station list yields NoPlayableStation; the UI shows that error instead of 0/0."
    added: "2026-11-03"
    revised: ""

  - name: onboarding_active
    status: active
    source: design/gdd/first-run-onboarding.md
    referenced_by:
      - design/gdd/first-run-onboarding.md
      - design/gdd/run-flow.md
      - design/gdd/in-game-hud.md
    variables:
