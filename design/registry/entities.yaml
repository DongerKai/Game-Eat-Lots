# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: load_outcome
    status: active
    source: design/gdd/save-system.md
    referenced_by:
      - design/gdd/save-system.md
    variables:
      - P
      - B
      - V
      - L
    output_range: "Fresh | Loaded | Migrated | Recovered | ReadOnly | Blocked"
    expression: "Blocked if readable(P) and version(P) > V; ReadOnly if L = live and readable(P); Blocked if L = live; Fresh if P empty and B empty; Loaded if readable(P) and valid(P) and version(P) = V; Migrated if readable(P) and valid(P) and version(P) < V and migrate succeeds; Blocked if readable(P) and valid(P) and version(P) < V and migrate fails; Recovered if backup valid and migratable; else Blocked"
    notes: "Load decision for the save system. P = primary file, B = backup, V = SAVE_SCHEMA_VERSION, L = lock state. valid(x) means structurally legal under the schema of its declared version(x), so a version-0 fixture can migrate. ReadOnly = a live lock over a readable primary with version(P) <= V (browse, never write; an older version renders via in-memory read-only migration and is not migrated on disk). A higher-than-current version is Blocked before the lock branches; a live-lock Blocked offers only exit/retry, never a new career. A readable primary whose migration fails is Blocked, never Recovered."
    added: "2026-11-03"
    revised: ""

  - name: migrate
    status: active
    source: design/gdd/save-system.md
    referenced_by:
      - design/gdd/save-system.md
    variables:
      - s
      - v_src
      - v_dst
    output_range: "SaveFile | MigrationError"
    expression: "(m_v_dst o ... o m_{v_src+1})(s)"
    notes: "One step per schema version, upward only. Each step is a pure function; unknown top-level keys are preserved under extensions."
    added: "2026-11-03"
    revised: ""

  - name: save_bytes
    status: active
    source: design/gdd/save-system.md
    referenced_by:
      - design/gdd/save-system.md
    variables:
      - B_base
      - n_upg
      - U
      - n_sta
      - S
      - n_dish
      - D
      - n_rec
      - R
      - n_ms
      - M
      - ext_bytes
    output_range: [0, 262144]
    expression: "B_base + n_upg*U + n_sta*S + n_dish*D + n_rec*R + n_ms*M + ext_bytes"
    notes: "Serialized save-size upper bound. Full Vision load is about 8.5 KiB against a 256 KiB hard cap."
    added: "2026-11-03"
    revised: ""

  - name: slots_available
    status: active
    source: design/gdd/save-system.md
    referenced_by:
      - design/gdd/save-system.md
    variables:
      - MAX_SLOTS
      - used_slots
    output_range: [0, 8]
    expression: "MAX_SLOTS - used_slots"
    notes: "Career slots left. MVP uses MAX_SLOTS = 1; 0 is the normal state after the first career is created."
    added: "2026-11-03"
    revised: ""

  - name: run_id_alloc
    status: active
    source: design/gdd/run-flow.md
    referenced_by:
      - design/gdd/run-flow.md
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - max_seen_run_id
    output_range: "1..INT64_MAX"
    expression: "run_id = max_seen_run_id + 1"
    notes: "Session-scoped in MVP, starts at 1, never wraps. Settlement uses run_id as its dedup key."
    added: "2026-11-03"
    revised: ""

  - name: run_seed
    status: active
    source: design/gdd/run-flow.md
    referenced_by:
      - design/gdd/run-flow.md
      - design/gdd/menu-waves.md
    variables:
      - RunConfig.seed
      - session_rng
    output_range: "int64"
    expression: "RunConfig.seed if not null else int64(next_u64(session_rng))"
    notes: "0 is a valid explicit seed. The same seed plus the same action sequence must reproduce the same RunLog."
    added: "2026-11-03"
    revised: ""

  - name: end_reason
    status: active
    source: design/gdd/run-flow.md
    referenced_by:
      - design/gdd/run-flow.md
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - turns_remaining
      - no_eatable
    output_range: "NONE | TIME_EXHAUSTED | NO_EATABLE_DISH"
    expression: "TIME_EXHAUSTED if turns_remaining = 0 else (NO_EATABLE_DISH if no_eatable else NONE)"
    notes: "TIME_EXHAUSTED wins when both conditions hold. Evaluated once after init and once after each committed action."
    added: "2026-11-03"
    revised: ""

  - name: capacity_total
    status: active
    source: design/gdd/stomach-capacity.md
    referenced_by:
      - design/gdd/stomach-capacity.md
      - design/gdd/run-flow.md
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - C0
      - capacity_bonus
    output_range: [1, 999]
    expression: "capacity_total = C0 + capacity_bonus"
    notes: "C0 = BalanceData.base_capacity (MVP 20; data ownership is stomach Open Question 1). capacity_bonus comes from the run's frozen upgrade snapshot."
    added: "2026-11-03"
    revised: ""

  - name: can_fit
    status: active
    source: design/gdd/stomach-capacity.md
    referenced_by:
      - design/gdd/stomach-capacity.md
      - design/gdd/run-flow.md
    variables:
      - e
      - capacity_used
      - capacity_total
    output_range: "true | false"
    expression: "(e is integer and e >= 1) and (capacity_used + e <= capacity_total)"
    notes: "Equal-to-capacity is allowed. e < 1 is a defensive error; e > capacity_total is legal and returns false."
    added: "2026-11-03"
    revised: ""

  - name: record_is_better
    status: active
    source: design/gdd/records-and-milestones.md
    referenced_by:
      - design/gdd/records-and-milestones.md
      - design/gdd/settlement-and-entry-fee.md
    variables:
      - r_new.net_profit
      - r_old.net_profit
    output_range: "true | false"
    expression: "(r_old is null) or (r_new.net_profit > r_old.net_profit)"
    notes: "Net profit only; ties keep the old record. Never compares time, total value or return ratio."
    added: "2026-11-03"
    revised: ""

  - name: milestone_met
    status: active
    source: design/gdd/records-and-milestones.md
    referenced_by:
      - design/gdd/records-and-milestones.md
      - design/gdd/save-system.md
    variables:
      - m.metric
      - m.threshold
      - m.station_id
      - u
      - c
    output_range: "true | false"
    expression: "station_ok(m, u) and metric_met(m.metric, m.threshold, u, c)"
    notes: "Metrics: NET_PROFIT, RETURN_RATIO_X10, LIFETIME_NET_PROFIT, RUNS_SETTLED. Thresholds live in MilestoneData, not in the formula."
    added: "2026-11-03"
    revised: ""

  - name: wallet_after_run
    status: active
    source: design/gdd/meta-upgrades.md
    referenced_by:
      - design/gdd/meta-upgrades.md
    variables:
      - wallet
      - net_profit
    output_range: "int64"
    expression: "wallet' = checked_add_int64(wallet, net_profit(R))"
    notes: "Full net profit is credited, including losses; no gameplay clamp. Only overflow returns WALLET_OVERFLOW."
    added: "2026-11-03"
    revised: ""

  - name: upgrade_price
    status: active
    source: design/gdd/meta-upgrades.md
    referenced_by:
      - design/gdd/meta-upgrades.md
    variables:
      - u.cost
      - L
      - u.cost_growth
    output_range: [0, 2147483647]
    expression: "ceil(u.cost * u.cost_growth^(L-1))"
    notes: "u.cost is the level-1 price (owned by meta-upgrades). cost_growth default 1.35, safe band 1.2-1.6, must be >= 1.0. Round once at the end."
    added: "2026-11-03"
    revised: ""

  - name: upgrade_tree_cost
    status: active
    source: design/gdd/meta-upgrades.md
    referenced_by:
      - design/gdd/meta-upgrades.md
    variables:
      - u
    output_range: [0, 2147483647]
    expression: "sum(price(u, L) for L in 1..max_level(u))"
    notes: "Design-time only. MVP full tree is 209."
    added: "2026-11-03"
    revised: ""

  - name: menu_vision_useful_max
    status: active
    source: design/gdd/meta-upgrades.md
    referenced_by:
      - design/gdd/meta-upgrades.md
      - design/gdd/menu-waves.md
    variables:
      - wave_size(s)
      - u.effect_value
    output_range: [0, 7]
    expression: "ceil((wave_size(s) - 1) / u.effect_value)"
    notes: "Highest level that still adds preview for a station. Buying past it is rejected as NO_EFFECT; menu-waves still clamps the actual preview."
    added: "2026-11-03"
    revised: ""

  - name: station_available
    status: active
    source: design/gdd/unlocks-and-stations.md
    referenced_by:
      - design/gdd/unlocks-and-stations.md
      - design/gdd/ui-flow.md
    variables:
      - s.unlock_cost
      - s.id
      - U.stations
    output_range: "true | false"
    expression: "(s.unlock_cost = 0) or (s.id in U.stations)"
    notes: "A station is playable when it is free or explicitly unlocked. Unknown ids are rejected before this formula."
    added: "2026-11-03"
    revised: ""

  - name: effective_unlocks
    status: active
    source: design/gdd/unlocks-and-stations.md
    referenced_by:
      - design/gdd/unlocks-and-stations.md
      - design/gdd/save-system.md
    variables:
      - U
      - S
    output_range: "stations[] + dishes[]"
    expression: "S_eff = S_free + {s in S : s.id in U.stations}; stations = sort(ids(S_eff) + (U.stations - S_ids)); dishes = sort(U.dishes + union(dish_pool of S_eff))"
    notes: "Normalizes the unlock set and backfills free stations/dishes. Monotonic: never removes an id. Unknown ids are preserved."
    added: "2026-11-03"
    revised: ""

  - name: unlock_decision
    status: active
    source: design/gdd/unlocks-and-stations.md
    referenced_by:
      - design/gdd/unlocks-and-stations.md
      - design/gdd/ui-flow.md
    variables:
      - s.unlock_cost
      - U
      - L
      - wallet
    output_range: "OK | ALREADY_UNLOCKED | PREREQUISITE_LOCKED | INSUFFICIENT_FUNDS | INVALID_STATION_DATA"
    expression: "INVALID_STATION_DATA if s.unlock_cost < 0; ALREADY_UNLOCKED if station_available; PREREQUISITE_LOCKED if any requires(s) level < 1; INSUFFICIENT_FUNDS if wallet < s.unlock_cost; else OK"
    notes: "INVALID_STATION_DATA must precede INSUFFICIENT_FUNDS so a negative price can never reach spend(). requires(s) is empty until StationData.unlock_requires exists."
    added: "2026-11-03"
    revised: ""

  - name: station_unlock_cost
    status: active
    source: design/gdd/unlocks-and-stations.md
    referenced_by:
      - design/gdd/unlocks-and-stations.md
      - design/gdd/meta-upgrades.md
    variables:
      - s.unlock_cost
    output_range: [0, 2147483647]
    expression: "station_unlock_cost(s) = s.unlock_cost"
    notes: "One-time price; no level, count or state input. Free stations never reach the purchase path."
    added: "2026-11-03"
    revised: ""

  - name: runs_to_unlock
    status: active
    source: design/gdd/unlocks-and-stations.md
    referenced_by:
      - design/gdd/unlocks-and-stations.md
    variables:
      - s.unlock_cost
      - opt_net_profit(p)
    output_range: "0..INT32_MAX | null"
    expression: "null if opt_net_profit(p) <= 0 else ceil(s.unlock_cost / opt_net_profit(p))"
    notes: "Design-time pacing only. Target band 4-8 runs. opt_net_profit(p) = opt_value(p) - entry_fee; MVP 104 - 85 = 19."
    added: "2026-11-03"
    revised: ""

  - name: unlock_progress
    status: active
    source: design/gdd/unlocks-and-stations.md
    referenced_by:
